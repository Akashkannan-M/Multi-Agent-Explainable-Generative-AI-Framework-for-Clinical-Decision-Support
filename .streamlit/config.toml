[server]
headless = true
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
# Keep the full toolbar so the native Light/Dark theme toggle stays
# available and functional across Streamlit versions.
toolbarMode = "auto"

[theme]
primaryColor = "#1976d2"
# NOTE: backgroundColor, secondaryBackgroundColor and textColor are intentionally
# NOT set. Hardcoding them forces the Light palette and prevents Streamlit's
# native Light/Dark toggle from visually switching. Leaving them out lets the
# theme picker apply both palettes correctly.
