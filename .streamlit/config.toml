[server]
headless = true
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
# Removes the "Fork", "GitHub" and other Streamlit Cloud toolbar items
# while keeping the theme (Light/Dark) toggle available.
toolbarMode = "minimal"

[theme]
primaryColor = "#1976d2"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#e8e8e8"
textColor = "#111111"
